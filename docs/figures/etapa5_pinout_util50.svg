<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 24px; font-weight: 700; }
    .sub { font-size: 14px; fill: #536078; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12px; fill: #536078; }
    .die { fill: #f5f7fa; stroke: #172033; stroke-width: 3; }
    .core { fill: #e8eef8; stroke: #7790b5; stroke-width: 2; stroke-dasharray: 7 5; }
    .pin { fill: #e64b3c; stroke: white; stroke-width: 2; }
    .power { fill: #8056d6; stroke: white; stroke-width: 2; }
    .line { fill: none; stroke: #536078; stroke-width: 1.5; }
    .group { fill: #fff; stroke: #c7cfdb; stroke-width: 1.5; rx: 8; }
  </style>
  <text x="40" y="38" class="title">Terminales del macro ASIC — ROM+RAM, FP_CORE_UTIL=50</text>
  <text x="40" y="61" class="sub">Coordenadas extraídas de 25-openroad-ioplacement/asic_top.def; origen físico abajo a la izquierda.</text>

  <rect x="220" y="82" width="560" height="578" class="die"/>
  <rect x="233" y="96" width="534" height="550" class="core"/>
  <text x="500" y="372" text-anchor="middle" class="label">Core digital</text>
  <text x="500" y="394" text-anchor="middle" class="small">546,43 µm × 564,35 µm (die)</text>

  <!-- Exact signal-pin locations, scaled from DEF coordinates. -->
  <circle cx="220.3" cy="108.0" r="6" class="pin"/>
  <path d="M220 108 L148 108" class="line"/>
  <text x="140" y="113" text-anchor="end" class="label">clk_i</text>
  <text x="140" y="131" text-anchor="end" class="small">izquierda superior</text>

  <circle cx="221.4" cy="659.7" r="6" class="pin"/>
  <path d="M221 660 L148 660" class="line"/>
  <text x="140" y="665" text-anchor="end" class="label">spi_mosi_i</text>
  <text x="140" y="683" text-anchor="end" class="small">borde inferior</text>

  <circle cx="780" cy="638" r="6" class="pin"/>
  <path d="M780 638 L824 638 L824 650" class="line"/>
  <rect x="824" y="626" width="142" height="48" class="group"/>
  <text x="895" y="647" text-anchor="middle" class="label">rst_ni</text>
  <text x="895" y="665" text-anchor="middle" class="small">derecha inferior</text>

  <circle cx="780" cy="426" r="5" class="pin"/>
  <circle cx="780" cy="419" r="5" class="pin"/>
  <circle cx="780" cy="408" r="5" class="pin"/>
  <path d="M780 417 L824 417" class="line"/>
  <rect x="824" y="390" width="142" height="55" class="group"/>
  <text x="895" y="411" text-anchor="middle" class="label">SPI</text>
  <text x="895" y="430" text-anchor="middle" class="small">SCLK, CS_n, MISO</text>

  <circle cx="780" cy="374" r="5" class="pin"/>
  <circle cx="780" cy="369" r="5" class="pin"/>
  <circle cx="780" cy="359" r="5" class="pin"/>
  <circle cx="780" cy="319" r="5" class="pin"/>
  <path d="M780 351 L824 351" class="line"/>
  <rect x="824" y="326" width="142" height="51" class="group"/>
  <text x="895" y="347" text-anchor="middle" class="label">btn_i[3:0]</text>
  <text x="895" y="366" text-anchor="middle" class="small">borde derecho</text>

  <circle cx="780" cy="358" r="4" class="pin"/>
  <circle cx="780" cy="332" r="4" class="pin"/>
  <circle cx="780" cy="305" r="4" class="pin"/>
  <circle cx="780" cy="304" r="4" class="pin"/>
  <path d="M780 307 L824 307" class="line"/>
  <rect x="824" y="282" width="142" height="46" class="group"/>
  <text x="895" y="303" text-anchor="middle" class="label">leds_o[3:0]</text>
  <text x="895" y="321" text-anchor="middle" class="small">borde derecho</text>

  <circle cx="780" cy="300" r="4" class="pin"/>
  <circle cx="780" cy="281" r="4" class="pin"/>
  <circle cx="780" cy="278" r="4" class="pin"/>
  <path d="M780 283 L824 263" class="line"/>
  <rect x="824" y="238" width="142" height="48" class="group"/>
  <text x="895" y="259" text-anchor="middle" class="label">seg2_n_o[6:0]</text>
  <text x="895" y="277" text-anchor="middle" class="small">y = 348,6…371,0 µm</text>

  <circle cx="780" cy="263" r="4" class="pin"/>
  <circle cx="780" cy="238" r="4" class="pin"/>
  <circle cx="780" cy="231" r="4" class="pin"/>
  <path d="M780 239 L824 205" class="line"/>
  <rect x="824" y="180" width="142" height="48" class="group"/>
  <text x="895" y="201" text-anchor="middle" class="label">seg1_n_o[6:0]</text>
  <text x="895" y="219" text-anchor="middle" class="small">y = 386,7…418,0 µm</text>

  <circle cx="500" cy="152" r="7" class="power"/>
  <circle cx="500" cy="148" r="7" class="power"/>
  <path d="M500 148 L500 118" class="line"/>
  <rect x="420" y="82" width="160" height="38" class="group"/>
  <text x="500" y="106" text-anchor="middle" class="label">VDD / VSS</text>

  <text x="40" y="724" class="small">Los grupos indican rangos reales del DEF; los segmentos individuales están muy próximos y se resumen para legibilidad.</text>
</svg>
